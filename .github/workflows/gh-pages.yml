name: Deploy Hugo Blog

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: latest
          extended: true

      - uses: actions/configure-pages@v5

      # Remove stale generated pages from earlier builds before rendering.
      - name: Clean and build Hugo
        run: |
          rm -rf public
          hugo --minify

      - uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

      # GitHub's artifact index can lag behind upload completion briefly.
      # A fresh workflow run plus this pause avoids transient "0 artifacts" errors.
      - name: Wait for Pages artifact availability
        run: sleep 15

      - id: deployment
        uses: actions/deploy-pages@v4
